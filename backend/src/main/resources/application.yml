server:
  # Cloud Run tells the container which port to listen on.
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dailymoney-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Every connection (JPA and plain SQL) works in our schema, not Supabase's public one.
      schema: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC
  flyway:
    schemas: app
    default-schema: app
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:set-firebase-project-id}
    service-account-file: ${FIREBASE_SERVICE_ACCOUNT_FILE:}
  rate-limit:
    per-minute: ${RATE_LIMIT_PER_MINUTE:240}
    burst: ${RATE_LIMIT_BURST:120}
  invite:
    link-base: ${INVITE_LINK_BASE:https://dailymoney-app.web.app/invite/}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  # Off in production; set API_DOCS_ENABLED=true locally to browse /swagger-ui.html.
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
